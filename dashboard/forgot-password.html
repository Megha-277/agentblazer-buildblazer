<!DOCTYPE html>
<html lang="en" data-theme="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot Password — AgentBlazer Club Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo-mark.png" type="image/png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="a-body">

<div class="ambient" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<main class="auth">
  <div class="auth-card" style="max-width:420px">
    <div class="auth-mark">
      <picture>
        <source srcset="../assets/logo.webp" type="image/webp">
        <img src="../assets/logo.png" alt="AgentBlazer Club" width="64" height="74">
      </picture>
    </div>

    <h1>Reset your <em>password</em></h1>
    <p class="sub">Enter your dashboard email and we'll send a reset link via Supabase Auth.</p>

    <form class="auth-form" id="fp-form" novalidate>
      <div class="a-alert" id="fp-error"   role="alert"  hidden></div>
      <div class="a-alert" id="fp-success" role="status" hidden
           style="background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:#22c55e"></div>

      <div class="f">
        <label for="fp-email">Dashboard Email</label>
        <input id="fp-email" name="email" type="email" autocomplete="email"
               placeholder="you@example.com" required maxlength="254">
      </div>

      <button class="btn btn-1" type="submit" id="fp-btn"
              style="justify-content:center;width:100%">
        Send Reset Link
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="auth-foot">
      <a href="login.html">← Back to sign in</a>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
(function () {
  "use strict";

  try { var t = localStorage.getItem("ab-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

  var BASE_URL = (typeof window.API_BASE_URL !== "undefined") ? window.API_BASE_URL : "";
  var form = document.getElementById("fp-form");
  var errorEl = document.getElementById("fp-error");
  var successEl = document.getElementById("fp-success");
  var btn = document.getElementById("fp-btn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorEl.hidden = true; successEl.hidden = true;

    var email = document.getElementById("fp-email").value.trim().slice(0, 254);
    if (!email || !email.includes("@")) {
      errorEl.textContent = "Please enter a valid email address.";
      errorEl.hidden = false;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      var res = await fetch(BASE_URL + "/api/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email })
      });
      // Always show success message regardless of whether email exists
      // (prevents email enumeration)
      successEl.textContent = "If that email has an account, a password reset link has been sent. Check your inbox.";
      successEl.hidden = false;
      form.reset();
    } catch (_) {
      successEl.textContent = "If that email has an account, a password reset link has been sent. Check your inbox.";
      successEl.hidden = false;
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Send Reset Link <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
    }
  });

  // Minimal starfield
  var sc = document.getElementById("stars");
  if (!sc || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var sx = sc.getContext("2d"), stars = [], W, H;
  function size() {
    W = innerWidth; H = innerHeight;
    sc.width = W * devicePixelRatio; sc.height = H * devicePixelRatio;
    sc.style.width = W + "px"; sc.style.height = H + "px";
    sx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    var n = Math.min(60, Math.round(W * H / 22000));
    stars = Array.from({ length: n }, function () {
      return { x: Math.random()*W, y: Math.random()*H, vx:(Math.random()-.5)*.1,
               vy:(Math.random()-.5)*.1, r:Math.random()*1.2+.4, tw:Math.random()*6.28 };
    });
  }
  size(); addEventListener("resize", size);
  (function loop() {
    var col = getComputedStyle(document.documentElement).getPropertyValue("--star").trim()||"rgba(160,190,255,.8)";
    sx.clearRect(0,0,W,H);
    stars.forEach(function(s){ s.x+=s.vx; s.y+=s.vy; s.tw+=.02;
      if(s.x<-10)s.x=W+10; if(s.x>W+10)s.x=-10;
      if(s.y<-10)s.y=H+10; if(s.y>H+10)s.y=-10;
      sx.globalAlpha=.35+Math.sin(s.tw)*.28; sx.fillStyle=col;
      sx.beginPath(); sx.arc(s.x,s.y,s.r,0,7); sx.fill();
    });
    sx.globalAlpha=1; requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
