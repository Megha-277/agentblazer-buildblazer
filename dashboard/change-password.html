<!DOCTYPE html>
<html lang="en" data-theme="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set New Password — AgentBlazer Club Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo-mark.png" type="image/png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<style>
  .pw-rules { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .pw-rules li { font-size: 12px; color: var(--ink-4); display: flex; align-items: center; gap: 7px; }
  .pw-rules li::before { content: "○"; font-size: 10px; flex-shrink: 0; }
  .pw-rules li.ok { color: #22c55e; }
  .pw-rules li.ok::before { content: "✓"; }
  .pw-rules li.fail { color: #ef4444; }
  .pw-rules li.fail::before { content: "✗"; }
</style>
</head>
<body class="a-body">

<div class="ambient" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<main class="auth">
  <div class="auth-card" style="max-width:440px">
    <div class="auth-mark">
      <picture>
        <source srcset="../assets/logo.webp" type="image/webp">
        <img src="../assets/logo.png" alt="AgentBlazer Club" width="64" height="74">
      </picture>
    </div>

    <h1>Set your <em>new password</em></h1>
    <p class="sub">Your temporary password must be changed before you can use the dashboard.</p>

    <form class="auth-form" id="cp-form" novalidate>
      <div class="a-alert" id="cp-error" role="alert" hidden></div>
      <div class="a-alert" id="cp-success" role="status" hidden
           style="background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:#22c55e"></div>

      <div class="f">
        <label for="cp-new">New Password</label>
        <div class="f-pw">
          <input id="cp-new" type="password" autocomplete="new-password"
                 placeholder="Min 8 chars, mixed case + number + symbol"
                 required maxlength="128">
          <button type="button" class="peek-btn" aria-label="Show">Show</button>
        </div>
        <ul class="pw-rules" id="pw-rules" aria-live="polite">
          <li id="rule-len">At least 8 characters</li>
          <li id="rule-upper">One uppercase letter (A–Z)</li>
          <li id="rule-lower">One lowercase letter (a–z)</li>
          <li id="rule-digit">One number (0–9)</li>
          <li id="rule-special">One special character (!@#$%^&amp;*…)</li>
        </ul>
      </div>

      <div class="f">
        <label for="cp-confirm">Confirm New Password</label>
        <div class="f-pw">
          <input id="cp-confirm" type="password" autocomplete="new-password"
                 placeholder="Repeat new password" required maxlength="128">
          <button type="button" class="peek-btn" aria-label="Show">Show</button>
        </div>
      </div>

      <button class="btn btn-1" type="submit" id="cp-btn"
              style="justify-content:center;width:100%;margin-top:8px">
        Set Password &amp; Enter Dashboard
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
(function () {
  "use strict";

  // Restore theme
  try { var t = localStorage.getItem("ab-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

  // Gate: must have a session to be on this page
  var rawSession = null;
  try { rawSession = sessionStorage.getItem("ab-session"); } catch (_) {}
  if (!rawSession) { window.location.replace("login.html"); }

  var BASE_URL = (typeof window.API_BASE_URL !== "undefined") ? window.API_BASE_URL : "";

  function getToken() {
    try { return JSON.parse(sessionStorage.getItem("ab-session")).access_token; } catch (_) { return ""; }
  }

  // Show/hide toggles
  document.querySelectorAll(".peek-btn").forEach(function (btn) {
    var input = btn.closest(".f-pw").querySelector("input");
    btn.addEventListener("click", function () {
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.textContent = show ? "Hide" : "Show";
      btn.setAttribute("aria-label", show ? "Hide" : "Show");
    });
  });

  // Live password strength checker
  var newInput = document.getElementById("cp-new");
  var RULES = [
    { id: "rule-len",     test: function (v) { return v.length >= 8; } },
    { id: "rule-upper",   test: function (v) { return /[A-Z]/.test(v); } },
    { id: "rule-lower",   test: function (v) { return /[a-z]/.test(v); } },
    { id: "rule-digit",   test: function (v) { return /[0-9]/.test(v); } },
    { id: "rule-special", test: function (v) { return /[!@#$%^&*()\-_=+\[\]{}|;':",.<>?/`~\\]/.test(v); } },
  ];

  function checkRules(v) {
    var allOk = true;
    RULES.forEach(function (r) {
      var el = document.getElementById(r.id);
      var ok = r.test(v);
      el.classList.toggle("ok",   ok);
      el.classList.toggle("fail", v.length > 0 && !ok);
      if (!ok) allOk = false;
    });
    return allOk;
  }

  if (newInput) {
    newInput.addEventListener("input", function () { checkRules(newInput.value); });
  }

  // Form submit
  var form    = document.getElementById("cp-form");
  var errorEl = document.getElementById("cp-error");
  var successEl = document.getElementById("cp-success");
  var btn     = document.getElementById("cp-btn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorEl.hidden = true; errorEl.textContent = "";

    var newPw  = document.getElementById("cp-new").value;
    var confPw = document.getElementById("cp-confirm").value;

    if (!checkRules(newPw)) {
      errorEl.textContent = "Password does not meet all requirements above.";
      errorEl.hidden = false;
      return;
    }
    if (newPw !== confPw) {
      errorEl.textContent = "Passwords do not match.";
      errorEl.hidden = false;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      var token = getToken();
      if (!token) throw new Error("Session expired. Please log in again.");

      var res = await fetch(BASE_URL + "/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ new_password: newPw })
      });

      if (!res.ok) {
        var err = await res.json().catch(function () { return {}; });
        throw new Error(err.detail || "Password change failed.");
      }

      successEl.textContent = "Password updated! Redirecting to your dashboard…";
      successEl.hidden = false;
      setTimeout(function () { window.location.replace("admin.html"); }, 1400);

    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      btn.disabled = false;
      btn.innerHTML = 'Set Password &amp; Enter Dashboard <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
    }
  });

  // Minimal starfield
  var sc = document.getElementById("stars");
  if (!sc || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var sx = sc.getContext("2d"), stars = [], W, H, mx = -999, my = -999;
  function size() {
    W = innerWidth; H = innerHeight;
    sc.width = W * devicePixelRatio; sc.height = H * devicePixelRatio;
    sc.style.width = W + "px"; sc.style.height = H + "px";
    sx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    var n = Math.min(70, Math.round(W * H / 20000));
    stars = Array.from({ length: n }, function () {
      return { x: Math.random()*W, y: Math.random()*H, vx:(Math.random()-.5)*.1,
               vy:(Math.random()-.5)*.1, r:Math.random()*1.2+.4, tw:Math.random()*6.28 };
    });
  }
  size(); addEventListener("resize", size);
  addEventListener("pointermove", function (e) { mx=e.clientX; my=e.clientY; }, { passive:true });
  (function loop() {
    var cs = getComputedStyle(document.documentElement);
    var col = cs.getPropertyValue("--star").trim()||"rgba(160,190,255,.8)";
    sx.clearRect(0,0,W,H);
    stars.forEach(function(s){ s.x+=s.vx; s.y+=s.vy; s.tw+=.02;
      if(s.x<-10)s.x=W+10; if(s.x>W+10)s.x=-10;
      if(s.y<-10)s.y=H+10; if(s.y>H+10)s.y=-10;
      sx.globalAlpha=.35+Math.sin(s.tw)*.28; sx.fillStyle=col;
      sx.beginPath(); sx.arc(s.x,s.y,s.r,0,7); sx.fill();
    });
    sx.globalAlpha=1; requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
