<!DOCTYPE html>
<html lang="en" data-theme="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — AgentBlazer Club Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo-mark.png" type="image/png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="a-body">

<div class="ambient" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<main class="auth">
  <div class="auth-card">
    <div class="auth-mark">
      <picture>
        <source srcset="../assets/logo.webp" type="image/webp">
        <img src="../assets/logo.png" alt="AgentBlazer Club" width="72" height="84">
      </picture>
    </div>

    <h1>Sign in to the <em>club dashboard</em></h1>
    <p class="sub">AgentBlazer Club — Department of CS&amp;E, SJEC</p>

    <form class="auth-form" id="login-form" autocomplete="on" novalidate>
      <div class="a-alert" id="login-error" role="alert" hidden></div>

      <div class="f">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email"
               placeholder="you@example.com" required maxlength="254">
      </div>

      <div class="f">
        <label for="login-password">Password</label>
        <div class="f-pw">
          <input id="login-password" name="password" type="password"
                 autocomplete="current-password" placeholder="Your password"
                 required maxlength="128">
          <button type="button" id="peek" aria-label="Show password">Show</button>
        </div>
      </div>

      <button class="btn btn-1" type="submit" id="login-btn" style="justify-content:center;width:100%">
        Sign in
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>

    <div class="auth-foot">
      <a href="../index.html">← Back to public site</a>
      <a href="forgot-password.html">Forgot password?</a>
    </div>
  </div>
</main>

<!-- 1. Config -->
<script src="config.js"></script>
<!-- 2. Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 3. Supabase client helper -->
<script src="supabaseClient.js"></script>
<!-- 4. Login handler -->
<script src="login.js"></script>

<script>
(function () {
  "use strict";

  // Restore theme
  try {
    var t = localStorage.getItem("ab-theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch (_) {}

  // SESSION BEHAVIOR: use sessionStorage only (cleared on hard reload / new tab).
  // If a valid session exists in sessionStorage, skip login.
  try {
    var raw = sessionStorage.getItem("ab-session");
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.access_token) {
        window.location.replace("admin.html");
      }
    }
  } catch (_) {}

  // Show/hide password toggle
  var peek = document.getElementById("peek");
  var pass = document.getElementById("login-password");
  if (peek && pass) {
    peek.addEventListener("click", function () {
      var show = pass.type === "password";
      pass.type = show ? "text" : "password";
      peek.textContent = show ? "Hide" : "Show";
      peek.setAttribute("aria-label", show ? "Hide password" : "Show password");
      pass.focus();
    });
  }

  // Minimal starfield
  var sc = document.getElementById("stars");
  if (!sc || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var sx = sc.getContext("2d"), stars = [], W, H, mx = -999, my = -999;
  function size() {
    W = innerWidth; H = innerHeight;
    sc.width = W * devicePixelRatio; sc.height = H * devicePixelRatio;
    sc.style.width = W + "px"; sc.style.height = H + "px";
    sx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    var n = Math.min(80, Math.round(W * H / 18000));
    stars = Array.from({ length: n }, function () {
      return { x: Math.random() * W, y: Math.random() * H,
               vx: (Math.random() - .5) * .12, vy: (Math.random() - .5) * .12,
               r: Math.random() * 1.3 + .4, tw: Math.random() * 6.28 };
    });
  }
  size();
  addEventListener("resize", size);
  addEventListener("pointermove", function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
  (function loop() {
    var cs = getComputedStyle(document.documentElement);
    var col = cs.getPropertyValue("--star").trim() || "rgba(160,190,255,.85)";
    var lin = cs.getPropertyValue("--line").trim() || "rgba(120,160,220,.16)";
    sx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.x += s.vx; s.y += s.vy; s.tw += .02;
      if (s.x < -12) s.x = W + 12; if (s.x > W + 12) s.x = -12;
      if (s.y < -12) s.y = H + 12; if (s.y > H + 12) s.y = -12;
      if (Math.hypot(s.x - mx, s.y - my) < 140) { s.x -= (mx - s.x) * .0015; s.y -= (my - s.y) * .0015; }
      sx.globalAlpha = .4 + Math.sin(s.tw) * .3; sx.fillStyle = col;
      sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 7); sx.fill();
      for (var j = i + 1; j < stars.length; j++) {
        var o = stars[j], dx = s.x - o.x, dy = s.y - o.y, dd = dx*dx + dy*dy;
        if (dd < 17000) {
          sx.globalAlpha = (1 - dd / 17000) * .45; sx.strokeStyle = lin; sx.lineWidth = .7;
          sx.beginPath(); sx.moveTo(s.x, s.y); sx.lineTo(o.x, o.y); sx.stroke();
        }
      }
    }
    sx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
